<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Selection Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <main>
    <header class="popup-brand">
      <img src="icons/icon48.png" alt="">
      <div>
        <h1>Quick Translate</h1>
        <p>Translate selected text and PDFs</p>
      </div>
    </header>
    <div class="popup-content">
    <label class="toggle-setting master-toggle">
      <input id="extension-enabled" type="checkbox" checked>
      <span>Enable automatic translation</span>
    </label>
    <label for="language">Translate into</label>
    <select id="language">
      <option value="tr">Turkish</option>
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="ru">Russian</option>
      <option value="ar">Arabic</option>
    </select>
    <label class="toggle-setting">
      <input id="redirect-pdf-links" type="checkbox">
      <span>Open direct .pdf links in this viewer</span>
    </label>
    <p class="setting-note">Only webpage links ending in .pdf are redirected. Chrome asks for website access; this cannot replace its default viewer.</p>
    <button id="open-current-pdf" type="button">Open current tab in PDF viewer</button>
    <button id="open-pdf" type="button" class="secondary">Open a PDF file</button>
    <p id="status" aria-live="polite">Webpage selections translate automatically. For PDFs, open them here to enable automatic translation.</p>
    <section id="last-result" hidden>
      <h2>Last translation</h2>
      <p id="original"></p>
      <p id="translated"></p>
    </section>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
